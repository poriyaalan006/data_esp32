<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Realtime Dashboard</title>
    <script>
        // Security check: Kick back to login if not authenticated
        if (sessionStorage.getItem("authenticated") !== "true") {
            window.location.href = "index.html";
        }
    </script>
</head>
<body>
    <h1>Realtime ESP32 Data</h1>
    <!-- Put your graphs, charts, and Modbus/analog data elements here -->
    
    <button onclick="logout()">Logout</button>

    <script>
        function logout() {
            sessionStorage.removeItem("authenticated");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
