<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Dashboard Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ESP32 Dashboard</h2>
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="checkPassword()">Login</button>
        <p id="error-msg" class="error">Incorrect password!</p>
    </div>

    <script>
        // Optional: A simple hash check so your plain text password isn't glaringly obvious in the code.
        // For maximum simplicity, you can just compare strings directly, e.g., if(pass === "your_secure_password")
        function checkPassword() {
            const pass = document.getElementById('password').value;
            
            // Example password: "12345678"
            if (pass === "12345678") {
                // Set a session flag so navigating around works smoothly
                sessionStorage.setItem("authenticated", "true");
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        }
    </script>
</body>
</html>
